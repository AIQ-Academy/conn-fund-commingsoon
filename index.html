<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B1426">
<title>Coming Soon</title>
<style>
  :root{
    --bg:#0B1426;
    --cream:#F2EBD8;
    --gold:#E3B93E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(ellipse at 50% 120%, rgba(227,185,62,.14), transparent 60%),
      var(--bg);
    color:var(--cream);
    font-family:Georgia,"Times New Roman",serif;
    display:flex;align-items:center;justify-content:center;
    text-align:center;
    padding:24px;
    padding-top:calc(24px + env(safe-area-inset-top,0px));
    padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  }

  h1{
    font-weight:700;
    font-size:clamp(3.4rem,15vw,10rem);
    line-height:.95;
    letter-spacing:-.025em;
  }
  h1 span{
    display:block;
    color:transparent;
    -webkit-text-stroke:2px var(--cream);
    background-image:linear-gradient(to bottom, transparent 50%, var(--gold) 50%);
    background-size:100% 200%;
    background-position:0 0;
    -webkit-background-clip:text;
    background-clip:text;
    animation:fill 4.5s ease-in-out infinite alternate;
  }
  h1 span + span{animation-delay:.35s}

  @keyframes fill{
    from{background-position:0 0}
    to{background-position:0 100%}
  }

  @media (prefers-reduced-motion: reduce){
    h1 span{animation:none;background-position:0 100%}
  }
</style>
</head>
<body>
  <h1><span>Coming</span><span>Soon</span></h1>
</body>
</html>
